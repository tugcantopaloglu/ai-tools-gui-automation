name: Local automation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt bandit pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m bandit -r src -ll
      - run: python -m pip_audit -r requirements.txt
